let page='dashboard',query='',filter='الكل',modal=null,detailId=null,mobileOpen=false,toastTimer;
const root=document.getElementById('app');
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pill=s=>`<span class="pill ${orderStatus(s)}">${safe(s)}</span>`;
const icons={dashboard:'▦',tickets:'▤',inventory:'▣',customers:'♙',locations:'▧'};

function head(label,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">AL-KHATIB ELECTRONICS</div><h1 class="h1">${label}</h1><p class="desc">${sub}</p></div><div class="actions">${actions}</div></div>`}
function metric(label,value,foot,ico,shade){return `<div class="metric"><div class="metric-top"><div class="metric-label">${label}</div><div class="metric-ico ${shade}">${ico}</div></div><div class="metric-value">${fmt(value)}</div><div class="metric-footer">${foot}</div></div>`}
function filteredTickets(){return tickets.filter(t=>{const c=getCustomer(t.customerId);return (filter==='الكل'||t.status===filter)&&[t.no,t.device,t.cat,t.brand,t.model,t.fault,c.name,c.phone].join(' ').toLowerCase().includes(query.toLowerCase())})}
function ticketsTable(data,small=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>رقم الطلب</th><th>الجهاز والعميل</th><th>تاريخ الاستلام</th><th>الحالة</th><th>الموقع</th><th></th></tr></thead><tbody>${data.length?data.map(t=>`<tr><td><span class="id">${safe(t.no)}</span></td><td><strong>${safe(t.device)}</strong><br><span class="muted">${safe(getCustomer(t.customerId).name)}</span></td><td>${safe(t.date)}</td><td>${pill(t.status)}</td><td><span class="muted">${safe(getLocation(t.loc).code)}</span></td><td><button class="mini-btn" data-detail="${t.id}">التفاصيل ←</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><strong>لا توجد طلبات مطابقة</strong>جرّب تغيير البحث أو الفلتر.</div></td></tr>`}</tbody></table></div>`}
function dashboard(){let active=tickets.filter(t=>t.status!=='تم التسليم');let low=inventory.filter(i=>i.qty<=i.min);let ready=tickets.filter(t=>t.status==='جاهز للتسليم');return `<div class="welcome"><div><div style="font-size:11px;color:#62d3cc;font-weight:800;margin-bottom:9px">مرحبًا بعودتك 👋</div><h2>كل ما تحتاجه لإدارة المحل، في مكان واحد.</h2><p>تابع الصيانة، اعثر على أي قطعة بسرعة، ونظّم أجهزة العملاء بكل سهولة.</p></div><button data-act="new-ticket">＋ استلام جهاز جديد</button></div><div class="metrics">${metric('أصناف المخزون',inventory.length,'أجهزة، قطع غيار وملحقات','▦','teal')}${metric('الأجهزة داخل المحل',active.length,'طلبات لم يتم تسليمها','▣','blue')}${metric('جاهزة للتسليم',ready.length,'يمكن التواصل مع أصحابها','✓','violet')}${metric('مخزون منخفض',low.length,'أصناف تحتاج متابعة','!','orange')}</div><div class="layout-2"><div class="stack"><div class="panel"><div class="panelhead"><div><h3>أحدث طلبات الصيانة</h3><p>آخر الأجهزة التي تم استقبالها ومتابعتها</p></div><button class="link-btn" data-nav="tickets">عرض جميع الطلبات ←</button></div>${ticketsTable(tickets.filter(t=>[t.no,t.device,getCustomer(t.customerId).name].join(' ').toLowerCase().includes(query.toLowerCase())).slice(0,5),true)}</div><div class="panel"><div class="panelhead"><div><h3>الوصول السريع</h3><p>عمليات شائعة داخل المحل</p></div></div><div style="padding:21px;display:flex;gap:10px;flex-wrap:wrap"><button class="outline-btn" data-act="new-item">＋ إضافة قطعة للمخزون</button><button class="outline-btn" data-nav="locations">▧ تصفح مواقع التخزين</button><button class="outline-btn" data-nav="customers">♙ سجل العملاء</button></div></div></div><div class="stack"><div class="panel"><div class="panelhead"><div><h3>أصناف منخفضة المخزون</h3><p>الكميات عند الحد الأدنى أو تحته</p></div><button class="link-btn" data-nav="inventory">المخزون ←</button></div>${low.length?low.slice(0,5).map(i=>`<div class="low-row"><div><div class="parttitle">${safe(i.name)}</div><div class="partsub">${safe(getLocation(i.loc).code)} · الحد الأدنى ${i.min}</div></div><div class="qty">${fmt(i.qty)} متبقي</div></div>`).join(''):'<div class="empty">جميع الأصناف فوق الحد الأدنى.</div>'}</div><div class="panel"><div class="panelhead"><div><h3>ملخص الحالات</h3><p>توزيع طلبات الصيانة</p></div></div><div style="padding:18px 22px">${statuses.slice(0,5).map(s=>{let n=tickets.filter(t=>t.status===s).length;return `<div style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;color:#6f8796;font-size:11px;margin-bottom:7px"><span>${safe(s)}</span><b>${n}</b></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,n/Math.max(tickets.length,1)*100)}%"></div></div></div>`}).join('')}</div></div></div></div>`}
function ticketPage(){const subset=filteredTickets();return `${head('طلبات الصيانة','استلام الأجهزة، متابعة الفحص والإصلاح، وتسليمها للعملاء.','<button class="primary-btn" data-act="new-ticket">＋ طلب صيانة جديد</button>')}<div class="section-note"><span>ⓘ</span> الأجهزة المسجلة هنا مملوكة للعملاء ولا تدخل ضمن مخزون المحل.</div><div class="toolbar"><div class="filter-tabs">${['الكل',...statuses].map(s=>`<button class="filter ${filter===s?'active':''}" data-filter="${safe(s)}">${safe(s)}<span class="count-circle">${s==='الكل'?tickets.length:tickets.filter(t=>t.status===s).length}</span></button>`).join('')}</div></div><div class="panel">${ticketsTable(subset)}</div>`}
function inventoryPage(){let arr=inventory.filter(i=>[i.name,i.cat,i.brand,i.model,i.type,getLocation(i.loc).code].join(' ').toLowerCase().includes(query.toLowerCase()));return `${head('إدارة المخزون','جميع الأجهزة والقطع المملوكة للمحل، مع كمياتها ومواقع تخزينها.','<button class="primary-btn" data-act="new-item">＋ إضافة عنصر للمخزون</button>')}<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>العنصر</th><th>التصنيف</th><th>الكمية</th><th>الحد الأدنى</th><th>الموقع</th><th>تكلفة الوحدة</th><th></th></tr></thead><tbody>${arr.length?arr.map(i=>`<tr><td><span class="device-icon">${i.type==='جهاز كامل'?'▣':'▧'}</span><strong>${safe(i.name)}</strong><br><span class="muted" style="padding-right:45px">${safe(i.brand||'—')} · ${safe(i.model||i.type)}</span></td><td>${safe(i.cat)}</td><td><strong>${fmt(i.qty)}</strong>${i.qty<=i.min?' <span style="color:#c69248;font-size:10px">⚠ منخفض</span>':''}</td><td>${fmt(i.min)}</td><td><span class="id">${safe(getLocation(i.loc).code)}</span></td><td>${money(i.cost)}</td><td><button class="mini-btn" data-stock="${i.id}">حركة مخزون</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><strong>لا توجد عناصر مطابقة</strong></div></td></tr>`}</tbody></table></div></div>`}
function customersPage(){let arr=customers.filter(c=>[c.name,c.phone].join(' ').toLowerCase().includes(query.toLowerCase()));return `${head('العملاء','بيانات العملاء وسجل الأجهزة التي جرى استقبالها لصيانتهم.','<button class="primary-btn" data-act="new-customer">＋ إضافة عميل</button>')}<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>اسم العميل</th><th>رقم الهاتف</th><th>طلبات الصيانة</th><th>آخر طلب</th><th></th></tr></thead><tbody>${arr.length?arr.map(c=>{let ts=tickets.filter(t=>t.customerId===c.id);return `<tr><td><span class="customer-initial">${safe(c.name.slice(0,1))}</span><strong>${safe(c.name)}</strong></td><td><span dir="ltr">${safe(c.phone)}</span></td><td><strong>${ts.length}</strong></td><td>${ts.length?ts.slice().sort((a,b)=>b.id-a.id)[0].date:'—'}</td><td>${ts.length?`<button class="mini-btn" data-detail="${ts.slice().sort((a,b)=>b.id-a.id)[0].id}">آخر طلب ←</button>`:'—'}</td></tr>`}).join(''):`<tr><td colspan="5"><div class="empty">لا يوجد عملاء مطابقون.</div></td></tr>`}</tbody></table></div></div>`}
function locationsPage(){let arr=locations.filter(l=>[l.code,l.name,l.desc].join(' ').toLowerCase().includes(query.toLowerCase()));return `${head('مواقع التخزين','مواقع واضحة للخزائن والرفوف والأدراج، والوصول إلى محتويات كل موقع.','<button class="primary-btn" data-act="new-location">＋ إضافة موقع</button>')}<div class="storage-grid">${arr.map(l=>{let parts=inventory.filter(i=>i.loc===l.id);let devices=tickets.filter(t=>t.loc===l.id&&t.status!=='تم التسليم');return `<button class="storage-card" data-location="${l.id}"><div class="storage-card-top"><div class="storage-icon">▤</div><span class="storage-code">${safe(l.code)}</span></div><div class="storage-title">${safe(l.name)}</div><div class="storage-sub">${safe(l.desc||'بدون وصف')}</div><div class="storage-line"><span>${parts.length} أصناف مخزون · ${devices.length} أجهزة عملاء</span><strong>عرض المحتويات ←</strong></div></button>`}).join('')||'<div class="empty">لا توجد مواقع مطابقة</div>'}</div>`}
function content(){const el=document.getElementById('content');if(!el)return;el.innerHTML=({dashboard:dashboard,tickets:ticketPage,inventory:inventoryPage,customers:customersPage,locations:locationsPage}[page]||dashboard)()+`<p class="footer-caption">© نموذج تفاعلي تجريبي · الخطيب للإلكترونيات · البيانات للمعاينة فقط</p>`}
function flash(msg){const el=document.getElementById('toastLayer');el.innerHTML=`<div class="toast">✓ ${safe(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',3400)}
function showModal(type,arg){modal={type,arg};drawLayers()}

function customerModal(){return modalFrame('إضافة عميل','الاسم ورقم الهاتف كافيان لإصدار طلب صيانة.',`<form id="customerForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>الاسم الكامل *</label><input name="name" required></div><div class="field"><label>الهاتف *</label><input name="phone" required></div></div></div><div class="modal-footer"><button class="primary-btn" type="submit">✓ إضافة العميل</button><button class="outline-btn" type="button" data-act="close-layers">إلغاء</button></div></form>`,true)}
function locationModal(){return modalFrame('إضافة موقع تخزين','أضف رمزًا مميزًا ووصفًا واضحًا لمكان القطع.',`<form id="locationForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>الرمز *</label><input name="code" required placeholder="A-03-01"></div><div class="field"><label>اسم الموقع *</label><input name="name" required placeholder="الخزانة A – الرف الثالث"></div><div class="field span2"><label>الوصف</label><input name="desc" placeholder="مثال: وحدات التغذية الصغيرة"></div></div></div><div class="modal-footer"><button class="primary-btn" type="submit">✓ حفظ الموقع</button><button class="outline-btn" type="button" data-act="close-layers">إلغاء</button></div></form>`,true)}
function stockModal(id){let i=inventory.find(x=>x.id===id);if(!i)return '';return modalFrame('حركة مخزون',`${safe(i.name)} · الكمية الحالية ${fmt(i.qty)}`,`<form id="stockForm" data-id="${id}"><div class="modal-body"><div class="form-grid"><div class="field"><label>نوع الحركة</label><select name="type"><option value="in">إضافة كمية</option><option value="out">سحب كمية</option></select></div><div class="field"><label>الكمية *</label><input type="number" name="amount" min="1" value="1" required></div><div class="field span2"><label>ملاحظة</label><input name="note" placeholder="سبب الإضافة أو السحب"></div></div></div><div class="modal-footer"><button class="primary-btn" type="submit">✓ تسجيل الحركة</button><button class="outline-btn" type="button" data-act="close-layers">إلغاء</button></div></form>`,true)}
function details(t){let customer=getCustomer(t.customerId),total=t.fee+t.labor+t.parts.reduce((s,p)=>s+p.qty*p.cost,0),balance=total-t.paid;return `<div class="drawerback" data-act="close-layers"></div><section class="drawer"><div class="drawer-title"><div><span class="id">${safe(t.no)}</span><h2>${safe(t.device)}</h2>${pill(t.status)}</div><button class="xbtn" data-act="close-layers">×</button></div><div class="drawer-content"><div class="info-grid"><div><span class="info-label">العميل</span><span class="info-value">${safe(customer.name)}</span></div><div><span class="info-label">رقم الهاتف</span><span class="info-value" dir="ltr">${safe(customer.phone)}</span></div><div><span class="info-label">تاريخ الاستلام</span><span class="info-value">${safe(t.date)}</span></div><div><span class="info-label">موقع الجهاز</span><span class="info-value">${safe(getLocation(t.loc).code)}</span></div><div><span class="info-label">الماركة والموديل</span><span class="info-value">${safe(t.brand||'—')} · ${safe(t.model||'—')}</span></div><div><span class="info-label">الملحقات</span><span class="info-value">${safe(t.accessories||'لا يوجد')}</span></div></div><div class="detail-box"><b>العطل المبلغ عنه</b>${safe(t.fault)}</div><div class="detail-section"><h3>تحديث الحالة والتشخيص</h3><div class="field"><label>حالة الصيانة</label><select id="ticketStatus" data-ticket="${t.id}">${statuses.map(s=>`<option ${t.status===s?'selected':''}>${safe(s)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>نتيجة الفحص</label><textarea id="diagnosisField" placeholder="نتيجة التشخيص الفني...">${safe(t.diagnosis||'')}</textarea></div><div class="field" style="margin-top:12px"><label>العمل المنفذ</label><textarea id="workField" placeholder="الإصلاح أو الإجراءات المنفذة...">${safe(t.work||'')}</textarea></div><button class="outline-btn" style="margin-top:11px" data-act="save-notes" data-id="${t.id}">حفظ ملاحظات الإصلاح</button></div><div class="detail-section"><h3>قطع الغيار المستخدمة</h3>${t.parts.length?t.parts.map(p=>`<div class="amount-row"><span>${safe(p.name)} × ${p.qty}</span><strong>${money(p.cost*p.qty)}</strong></div>`).join(''):'<p class="tiny-text">لم يتم تسجيل قطع مستخدمة.</p>'}<div class="flex" style="margin-top:13px"><select id="usedItem" style="flex:1;min-width:0;padding:10px;border:1px solid #dae5ea;border-radius:9px;font-size:11px"><option value="">اختر قطعة من المخزون</option>${inventory.filter(i=>i.qty>0).map(i=>`<option value="${i.id}">${safe(i.name)} (${i.qty})</option>`).join('')}</select><input id="usedQty" type="number" value="1" min="1" style="width:60px;padding:10px;border:1px solid #dae5ea;border-radius:9px"><button class="mini-btn" data-act="use-part" data-id="${t.id}">إضافة</button></div><div class="tiny-text" style="margin-top:7px">يُخصم المخزون مباشرة عند إضافة قطعة للصيانة.</div></div><div class="detail-section"><h3>الرسوم والمدفوعات</h3><div class="form-grid"><div class="field"><label>أجرة الفحص ₪</label><input id="feeField" type="number" min="0" value="${t.fee}"></div><div class="field"><label>أجرة الإصلاح ₪</label><input id="laborField" type="number" min="0" value="${t.labor}"></div><div class="field span2"><label>المدفوع إجمالًا ₪</label><input id="paidField" type="number" min="0" value="${t.paid}"></div></div><button class="outline-btn" style="margin-top:11px" data-act="save-fees" data-id="${t.id}">حفظ المبالغ</button><div style="margin-top:17px"><div class="amount-row"><span>رسوم الفحص والإصلاح</span><span>${money(t.fee+t.labor)}</span></div><div class="amount-row"><span>تكلفة قطع الغيار للعميل</span><span>${money(t.parts.reduce((s,p)=>s+p.cost*p.qty,0))}</span></div><div class="amount-row total"><span>الإجمالي</span><span>${money(total)}</span></div><div class="amount-row"><span>المبلغ المتبقي</span><strong style="color:${balance>0?'#bc8b43':'#179474'}">${money(balance)}</strong></div></div></div></div></section>`}
function locationDetail(id){let l=getLocation(id),parts=inventory.filter(i=>i.loc===id),deviceTickets=tickets.filter(t=>t.loc===id&&t.status!=='تم التسليم');return modalFrame('محتويات الموقع',`${safe(l.code)} · ${safe(l.name)}`,`<div class="modal-body"><h3 class="grouphead">أصناف المخزون (${parts.length})</h3>${parts.length?parts.map(i=>`<div class="amount-row"><span>${safe(i.name)}</span><strong>${fmt(i.qty)} قطعة</strong></div>`).join(''):'<p class="muted">لا يوجد مخزون في هذا الموقع.</p>'}<h3 class="grouphead">أجهزة العملاء (${deviceTickets.length})</h3>${deviceTickets.length?deviceTickets.map(t=>`<div class="amount-row"><span>${safe(t.device)} · ${safe(t.no)}</span><span>${safe(t.status)}</span></div>`).join(''):'<p class="muted">لا توجد أجهزة عملاء في هذا الموقع.</p>'}</div><div class="modal-footer"><button class="outline-btn" data-act="close-layers">إغلاق</button></div>`,true)}
function drawLayers(){const el=document.getElementById('layers');if(!el)return;let html='';if(detailId){let t=tickets.find(t=>t.id===detailId);if(t)html=details(t)}else if(modal){html=({ticket:ticketModal,item:itemModal,customer:customerModal,location:locationModal,stock:()=>stockModal(modal.arg),locationDetail:()=>locationDetail(modal.arg)}[modal.type]||(()=>''))()}el.innerHTML=html;document.body.style.overflow=html?'hidden':''}
function navigate(next){page=next;query='';filter='الكل';mobileOpen=false;closeLayers();shell();window.scrollTo(0,0)}
function addTicket(form){const f=new FormData(form);let name=String(f.get('customer')).trim(),phone=String(f.get('phone')).trim();if(!name||!phone)return flash('يرجى إدخال بيانات العميل');let customer=customers.find(c=>c.phone===phone||c.name===name);if(!customer){customer={id:Math.max(0,...customers.map(x=>x.id))+1,name,phone};customers.unshift(customer)}let id=Math.max(0,...tickets.map(t=>t.id))+1;let ticket={id,no:'REP-'+String(id).padStart(6,'0'),customerId:customer.id,device:String(f.get('device')).trim(),cat:String(f.get('category')),brand:String(f.get('brand')),model:String(f.get('model')),serial:'',fault:String(f.get('fault')),condition:String(f.get('condition')),accessories:String(f.get('accessories')),loc:Number(f.get('loc')),status:'تم الاستلام',date:'2026-10-31',diagnosis:'',work:'',fee:Number(f.get('fee')||0),labor:0,paid:0,parts:[]};tickets.unshift(ticket);closeLayers();page='tickets';filter='الكل';query='';shell();flash('تم إنشاء طلب الصيانة '+ticket.no);detailId=id;drawLayers()}
function addItem(form){let f=new FormData(form);inventory.unshift({id:Math.max(0,...inventory.map(i=>i.id))+1,name:String(f.get('name')).trim(),cat:String(f.get('category')),type:String(f.get('type')),brand:String(f.get('brand')),model:String(f.get('model')),qty:Number(f.get('qty')||0),min:Number(f.get('min')||0),loc:Number(f.get('loc')),cost:Number(f.get('cost')||0)});closeLayers();page='inventory';query='';shell();flash('تم إضافة العنصر إلى المخزون')}
function addCustomer(form){let f=new FormData(form),name=String(f.get('name')).trim(),phone=String(f.get('phone')).trim();if(customers.some(c=>c.phone===phone))return flash('رقم الهاتف مسجل مسبقًا');customers.unshift({id:Math.max(0,...customers.map(c=>c.id))+1,name,phone});closeLayers();content();flash('تم إضافة العميل بنجاح')}
function addLocation(form){let f=new FormData(form),code=String(f.get('code')).trim().toUpperCase();if(locations.some(l=>l.code===code))return flash('رمز الموقع مستخدم سابقًا');locations.unshift({id:Math.max(0,...locations.map(l=>l.id))+1,code,name:String(f.get('name')),desc:String(f.get('desc'))});closeLayers();content();flash('تم إضافة موقع التخزين')}
function stockChange(form){let f=new FormData(form),item=inventory.find(i=>i.id===Number(form.dataset.id)),qty=Number(f.get('amount'));if(!item||!Number.isInteger(qty)||qty<1)return flash('الكمية غير صحيحة');if(f.get('type')==='out'&&qty>item.qty)return flash('الكمية المتوفرة أقل من المطلوب');item.qty+=f.get('type')==='in'?qty:-qty;closeLayers();content();flash('تم تحديث كمية المخزون')}
root.addEventListener('click',function(e){let navEl=e.target.closest('[data-nav]');if(navEl)return navigate(navEl.dataset.nav);let dt=e.target.closest('[data-detail]');if(dt){detailId=Number(dt.dataset.detail);modal=null;return drawLayers()}let stock=e.target.closest('[data-stock]');if(stock)return showModal('stock',Number(stock.dataset.stock));let loc=e.target.closest('[data-location]');if(loc)return showModal('locationDetail',Number(loc.dataset.location));let fil=e.target.closest('[data-filter]');if(fil){filter=fil.dataset.filter;return content()}let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;if(act==='new-ticket')return showModal('ticket');if(act==='new-item')return showModal('item');if(act==='new-customer')return showModal('customer');if(act==='new-location')return showModal('location');if(act==='toggle-mobile'){mobileOpen=!mobileOpen;return shell()}if(act==='close-mobile'){mobileOpen=false;return shell()}if(act==='reset'){if(confirm('هل تريد إعادة جميع البيانات التجريبية إلى حالتها الأصلية؟')){inventory=initialInventory.map(x=>({...x}));customers=initialCustomers.map(x=>({...x}));locations=initialLocations.map(x=>({...x}));tickets=initialTickets.map(x=>({...x}));query='';filter='الكل';page='dashboard';shell();flash('تمت إعادة البيانات التجريبية')}return}});
root.addEventListener('input',function(e){if(e.target.id==='globalSearch'){query=e.target.value;content()}});
root.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='ticketForm')return addTicket(e.target);if(e.target.id==='itemForm')return addItem(e.target);if(e.target.id==='customerForm')return addCustomer(e.target);if(e.target.id==='locationForm')return addLocation(e.target);if(e.target.id==='stockForm')return stockChange(e.target)});
root.addEventListener('change',function(e){if(e.target.id==='ticketStatus'){let t=tickets.find(t=>t.id===Number(e.target.dataset.ticket));if(t){t.status=e.target.value;if(t.status==='تم التسليم')t.deliveredAt='2026-10-31';drawLayers();content();flash('تم تحديث حالة الطلب')}}});
// The layers are descendants of the app root's sibling, so handle them separately.
document.addEventListener('click',function(e){const layer=e.target.closest('#layers');if(!layer)return;const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;if(act==='dismiss' && e.target!==el)return;if(['close-layers','dismiss'].includes(act))return closeLayers();const id=Number(el.dataset.id);let t=tickets.find(t=>t.id===id);if(!t)return;if(act==='save-notes'){t.diagnosis=document.getElementById('diagnosisField').value;t.work=document.getElementById('workField').value;drawLayers();flash('تم حفظ ملاحظات التشخيص والإصلاح')}if(act==='save-fees'){t.fee=Number(document.getElementById('feeField').value)||0;t.labor=Number(document.getElementById('laborField').value)||0;t.paid=Number(document.getElementById('paidField').value)||0;drawLayers();flash('تم حفظ الرسوم والمدفوعات')}if(act==='use-part'){let item=inventory.find(i=>i.id===Number(document.getElementById('usedItem').value));let qty=Number(document.getElementById('usedQty').value);if(!item)return flash('اختر قطعة من المخزون');if(!Number.isInteger(qty)||qty<1)return flash('أدخل كمية صحيحة');if(qty>item.qty)return flash('الكمية المتوفرة غير كافية');item.qty-=qty;t.parts.push({id:item.id,name:item.name,qty,cost:item.cost});drawLayers();content();flash('تم تسجيل القطعة وخصمها من المخزون')}});
document.addEventListener('submit',function(e){if(!e.target.closest('#layers'))return;e.preventDefault();const id=e.target.id;if(id==='ticketForm')return addTicket(e.target);if(id==='itemForm')return addItem(e.target);if(id==='customerForm')return addCustomer(e.target);if(id==='locationForm')return addLocation(e.target);if(id==='stockForm')return stockChange(e.target)});
document.addEventListener('change',function(e){if(e.target.id==='ticketStatus'){let t=tickets.find(t=>t.id===Number(e.target.dataset.ticket));if(t){t.status=e.target.value;drawLayers();content();flash('تم تحديث حالة الطلب')}}});
document.addEventListener('input',function(e){if(e.target.name==='customer'&&e.target.closest('#ticketForm')){let match=customers.find(c=>c.name===e.target.value);if(match)e.target.form.elements.phone.value=match.phone}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLayers()});
shell();
})();
</script>
</body>
</html>
